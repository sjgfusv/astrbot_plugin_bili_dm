name: astrbot_plugin_bili_dm
display_name: B站私信面板
short_desc: 需先装 Bilibili 私信适配器：给它配一个 WebUI 私信面板
desc: >-
  B 站私信可视化面板。需要先安装并启用 Bilibili 私信适配器，本插件复用它的客户端
  （不重复登录、不额外轮询），在 Dashboard 里查看会话列表、历史消息并直接回复。
  支持文本私信、B 站表情与本地图片表情、视频分享卡片、跟着调色盘变色的玻璃质感界面；
  打开自动定位最新消息，实时来消息像官方聊天一样平滑滚动。显示范围可在面板设置里
  切换「所有会话 / 只看指定的人」。另附不依赖 AstrBot 的独立运行模式。
version: v0.4.1
author: sjgfusv
repo: "https://github.com/sjgfusv/astrbot_plugin_bili_dm"
astrbot_version: ">=4.29.0"
support_platforms:
  - bilibili
logo: logo.png
